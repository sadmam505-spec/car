<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
				<title>Pro Racing Game</title>
				<style>
					body { margin: 0; background: #1a1a1a; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: sans-serif; }
					#gameContainer { width: 100%; max-width: 400px; height: 100%; display: flex; flex-direction: column; background: #444; position: relative; border: 2px solid #000; }

					/* Header & Points */
					#header { height: 50px; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: #fff; }
					#rewardSection { height: 40px; background: #333; display: flex; justify-content: center; align-items: center; }
					.reward-btn { background: #f1c40f; padding: 5px 10px; border-radius: 15px; font-weight: bold; font-size: 12px; border: none; cursor: pointer; }

					/* Game Area */
					#gameArea { flex: 1; position: relative; overflow: hidden; background: #333; touch-action: none; }
					.road-line { position: absolute; width: 6px; height: 50px; background: rgba(255,255,255,0.3); left: 50%; animation: moveLines 1s linear infinite; }
					@keyframes moveLines { from { top: -100px; } to { top: 100%; } }

					.obj { width: 50px; height: 80px; position: absolute; background-size: contain; background-repeat: no-repeat; transition: left 0.05s; }
					#userCar { background-image: url('user.png'); bottom: 20px; left: 160px; z-index: 10; }
					.enemy { background-image: url('enime.png'); }
					.reward { background-image: url('reward.png'); }

					.plusOne { position: absolute; color: #2ecc71; font-size: 24px; font-weight: bold; z-index: 20; animation: floatUp 1s ease-out forwards; }
					@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

					.controls { height: 80px; display: flex; background: #000; padding-bottom: env(safe-area-inset-bottom); }
					.controls button { flex: 1; background: #222; border: 1px solid #444; color: white; font-size: 30px; }
					#gameOverPopup, #startScreen { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
				</style>
			</head>
	<body>
		<div id="gameContainer">
			<div id="header">
				<div>🏠 Home</div>
				<div>
					💰 Score: <span id="score">0</span>
				</div>
				<div style="background:red; padding:4px 8px;">Claim</div>
			</div>
			<div id="rewardSection">
				<button class="reward-btn">Watch Ad for 2x Reward</button>
			</div>
			<div id="gameArea">
				<div class="road-line" style="left: 20%;"></div>
				<div class="road-line" style="left: 80%;"></div>
				<div id="userCar" class="obj"></div>
				<div id="startScreen">
					<button id="startBtn" style="padding:15px 30px; background:#2ecc71; border:none; color:white; font-size:20px; cursor:pointer;">START GAME</button>
				</div>
				<div id="gameOverPopup" style="display:none;">
					<h2>GAME OVER</h2>
					<button onclick="location.reload()" style="padding:15px; border:none; background:#e74c3c; color:white; cursor:pointer;">PLAY AGAIN</button>
				</div>
			</div>
			<div class="controls">
				<button id="leftBtn">◀</button>
				<button id="rightBtn">▶</button>
			</div>
		</div>

		<script>
			let userCar = document.getElementById('userCar'), gameArea = document.getElementById('gameArea'), score = 0, gameActive = false;
			let carX = 160, speed = 8;

			function moveUserCar(dir) {
			if (dir === 'left' && carX > 0) carX -= 15;
			if (dir === 'right' && carX < 340) carX += 15;
            userCar.style.left = carX + 'px';
        }

        function bindButton(id, dir) {
            const btn = document.getElementById(id);
            let interval;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); interval = setInterval(() => moveUserCar(dir), 30); });
            btn.addEventListener('touchend', () => clearInterval(interval));
            btn.addEventListener('mousedown', (e) => { interval = setInterval(() => moveUserCar(dir), 30); });
            btn.addEventListener('mouseup', () => clearInterval(interval));
        }
        bindButton('leftBtn', 'left'); bindButton('rightBtn', 'right');

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            gameActive = true;
            setInterval(() => { if(gameActive) spawnObject('enemy'); }, 1000);
            setInterval(() => { if(gameActive) spawnObject('reward'); }, 2500);
        });

        function spawnObject(type) {
            let el = document.createElement('div'), attempts = 0, isOverlapping, x;
            do {
                isOverlapping = false;
                x = Math.floor(Math.random() * 300);
                document.querySelectorAll('.obj').forEach(o => {
                    if (Math.abs(parseInt(o.style.left) - x) < 60 && parseInt(o.style.top) < 150) isOverlapping = true;
                });
                attempts++;
            } while (isOverlapping && attempts < 10);

            el.className = 'obj ' + type;
            el.style.left = x + 'px';
            el.style.top = '-80px';
            gameArea.appendChild(el);

            let move = setInterval(() => {
                if(!gameActive) { clearInterval(move); el.remove(); return; }
                el.style.top = (parseInt(el.style.top) + speed) + 'px';
                let uR = userCar.getBoundingClientRect(), eR = el.getBoundingClientRect();
                
                if (eR.bottom > uR.top + 20 && eR.top < uR.bottom - 20 && eR.right > uR.left + 20 && eR.left < uR.right - 20) {
                    if(type === 'enemy') { gameActive = false; document.getElementById('gameOverPopup').style.display = 'flex'; clearInterval(move); }
                    else {
                        score++; document.getElementById('score').innerText = score;
                        let p = document.createElement('div'); p.className = "plusOne"; p.innerText = "+1";
                        p.style.left = el.style.left; p.style.top = el.style.top;
                        gameArea.appendChild(p); setTimeout(() => p.remove(), 1000);
                        el.remove(); clearInterval(move);
                    }
                }
                if(parseInt(el.style.top) > 700) { el.remove(); clearInterval(move); }
            }, 20);
        }
		</script>
	</body>
</html>
