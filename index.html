<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
			<title>Pro Racing Game</title>
			<style>
				body { margin: 0; background: #333; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
				#gameContainer { width: 100%; max-width: 375px; height: 100vh; background: #444; position: relative; border: 2px solid #000; }
				#gameArea { width: 100%; height: 85%; position: relative; overflow: hidden; background: #333; }

				.road-line { position: absolute; width: 8px; height: 80px; background: white; left: 50%; margin-left: -5px; animation: moveLines .8s linear infinite; }
				@keyframes moveLines { from { top: -100px; } to { top: 100%; } }

				.obj { width: 50px; height: 80px; position: absolute; background-size: contain; background-repeat: no-repeat; transition: left 0.05s; }
				#userCar { background-image: url('user.png'); bottom: 20px; left: 160px; z-index: 10; }
				.enemy { background-image: url('enime.png'); }
				.reward { background-image: url('reward.png'); filter: drop-shadow(0 0 10px yellow); }

				.plusOne { position: absolute; color: #2ecc71; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 1s ease-out forwards; }
				@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

				#gameOverPopup { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 30; color: white; }
				.btn { padding: 15px 30px; background: #e74c3c; color: white; border: none; cursor: pointer; border-radius: 5px; }
				#scoreBoard { color: white; text-align: center; padding: 10px; font-size: 20px; font-weight: bold; }
			</style>
		</head>
	<body>
		<div id="gameContainer">
			<div id="scoreBoard">
				Score: <span id="score">0</span>
			</div>
			<div id="gameArea">
				<div class="road-line" style="top:0;"></div>
				<div class="road-line" style="top:200px;"></div>
				<div class="road-line" style="top:400px;"></div>
				<div id="userCar" class="obj"></div>
				<div id="gameOverPopup">
					<h2>GAME OVER</h2>
					<button class="btn" onclick="location.reload()">PLAY AGAIN</button>
				</div>
			</div>
			<div style="height: 15%; display: flex; background: #000;">
				<button id="leftBtn" style="flex:1">◀</button>
				<button id="rightBtn" style="flex:1">▶</button>
			</div>
		</div>

		<script>
			let userCar = document.getElementById('userCar'), gameArea = document.getElementById('gameArea');
			let carX = 160, score = 0, gameActive = true, moveInterval = null;
			let speed = 8;

			function startMoving(dir) {
			if(moveInterval) clearInterval(moveInterval);
			moveInterval = setInterval(() => {
			// বাউন্ডারি ফিক্স (০ থেকে ৩২৫)
			if(dir === 'left' && carX > 0) carX -= 12;
			if(dir === 'right' && carX < 325) carX += 12;
                userCar.style.left = carX + 'px';
            }, 30);
        }

        document.getElementById('leftBtn').onmousedown = () => startMoving('left');
        document.getElementById('rightBtn').onmousedown = () => startMoving('right');
        document.onmouseup = () => clearInterval(moveInterval);

        function spawnEnemy() {
            if(!gameActive) return;
            let el = document.createElement('div');
            el.className = 'obj enemy';
            el.style.left = Math.floor(Math.random() * 320) + 'px';
            el.style.top = '-80px';
            gameArea.appendChild(el);
            moveObject(el, false);
            setTimeout(spawnEnemy, 1000); // ১ সেকেন্ড পর পর এনমি
        }

        function spawnReward() {
            if(!gameActive) return;
            let el = document.createElement('div');
            el.className = 'obj reward';
            el.style.left = Math.floor(Math.random() * 320) + 'px';
            el.style.top = '-80px';
            gameArea.appendChild(el);
            moveObject(el, true);
            setTimeout(spawnReward, 2500); // ৩ সেকেন্ড পর পর রিওয়ার্ড
        }

        function moveObject(el, isReward) {
            let move = setInterval(() => {
                let top = parseInt(el.style.top);
                el.style.top = (top + speed) + 'px';
                let uR = userCar.getBoundingClientRect();
                let eR = el.getBoundingClientRect();
                if (eR.bottom > uR.top + 10 && eR.top < uR.bottom - 10 && eR.right > uR.left + 10 && eR.left < uR.right - 10) {
                    if(!isReward) { gameActive = false; document.getElementById('gameOverPopup').style.display = 'flex'; clearInterval(move); }
                    else { 
                        score++; document.getElementById('score').innerText = score;
                        let plus = document.createElement('div'); plus.className = 'plusOne'; plus.innerText = "+1";
                        plus.style.left = eR.left + "px"; plus.style.top = eR.top + "px"; gameArea.appendChild(plus);
                        setTimeout(() => plus.remove(), 1000);
                        el.remove(); clearInterval(move); 
                    }
                }
                if(top > 700) { el.remove(); clearInterval(move); }
            }, 20);
        }
        spawnEnemy();
        spawnReward();
		</script>
	</body>
</html>
